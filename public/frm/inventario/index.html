<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi inventario · ÑandutíHax</title>
<link rel="icon" href="/img/logo-chico.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/nanduti.css">
<script src="/js/tema.js"></script>
<script src="/js/sesion.js"></script>
<script>if (!Sesion.usuario()) location.replace("/frm/login/?volver=" + encodeURIComponent("/frm/inventario/"));</script>
</head>
<body>

<header class="barra">
  <a class="marca" href="/"><img src="/img/logo-chico.png" alt=""><span>ÑandutíHax</span></a>
  <div class="derecha" id="derecha"></div>
</header>

<main class="contenido">
  <div class="cabecera">
    <div>
      <h1>Mi inventario</h1>
      <p>Lo que compraste con tus monedas. Tocá una casilla para usarla o venderla.</p>
    </div>
    <div class="bolsa" title="Tus monedas">🪙 <b id="saldo">…</b></div>
  </div>

  <div class="aviso" id="aviso"></div>

  <div class="cofre">
    <div class="cofre-titulo">Camisetas</div>
    <div class="casillero" id="casillero"></div>

    <div class="cofre-titulo" style="margin-top:18px">Puesta</div>
    <div class="casillero puesta" id="casilleroPuesta"></div>
  </div>

  <!-- Las animaciones de gol tienen su propio apartado, aparte de las camisetas -->
  <div class="cofre" style="margin-top:18px">
    <div class="cofre-titulo">Animaciones de gol</div>
    <div class="casillero" id="casilleroAnim"></div>

    <div class="cofre-titulo" style="margin-top:18px">Puesta</div>
    <div class="casillero puesta" id="casilleroAnimPuesta"></div>
  </div>

  <!-- Los carteles de gol, su propio apartado -->
  <div class="cofre" style="margin-top:18px">
    <div class="cofre-titulo">Carteles de gol</div>
    <div class="casillero" id="casilleroScores"></div>

    <div class="cofre-titulo" style="margin-top:18px">Puesto</div>
    <div class="casillero puesta" id="casilleroScorePuesto"></div>
  </div>

  <!-- Lo que hay en la casilla elegida -->
  <section class="tarjeta" id="detalle" hidden>
    <div class="tarjeta-cuerpo detalle-item">
      <div class="camiseta-grande" id="itemCamiseta"><span id="itemNumero">10</span></div>
      <div id="itemScore" hidden>
        <div class="chat-previa"><div class="chat-linea" id="previaCartel">—</div></div>
      </div>
      <div class="previa-animacion" id="itemAnimacion" hidden>
        <div class="jugador-mini" id="muneco"><span id="avatarMini"></span></div>
        <button class="boton chico" type="button" id="probar">Probar</button>
      </div>
      <div class="detalle-datos">
        <h2 id="itemNombre">—</h2>
        <p class="tenue" id="itemTexto"></p>
        <dl class="lista-datos">
          <dt>Pagaste</dt><dd id="itemPagado">—</dd>
          <dt>Te dan si la vendés</dt><dd id="itemVale">—</dd>
          <dt>La compraste</dt><dd id="itemCuando">—</dd>
        </dl>
        <div class="acciones">
          <button class="boton principal" type="button" id="usar">Usar</button>
          <button class="boton peligro" type="button" id="vender">Vender</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const monedasTexto = (n) => Number(n || 0).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1").replace(".", ",");
const fondoCamiseta = (c) => `linear-gradient(${(c.angulo || 0) + 90}deg, #${c.colores[0]} 0 33.34%, #${c.colores[1]} 33.34% 66.67%, #${c.colores[2]} 66.67% 100%)`;

const CASILLAS = 18;   // 3 filas de 6, como un cofre
let inventario = { camisetas: [], puesta: null };
let animaciones = { animaciones: [], puesta: null };
let scores = { scores: [], puesto: null };
let elegida = null;
let tipoElegido = "camiseta";   // "camiseta" | "animacion"

// La cara de una animación en el casillero: su primer cuadro, o una estrella si solo cambia
// de tamaño (esas no tienen emoji).
const caraDe = (a) => (a.cuadros && a.cuadros.length ? a.cuadros[0] : "✨");

Sesion.pintarBarra($("derecha"));
Sesion.mantener();

function avisar(texto, clase) {
  $("aviso").className = "aviso" + (texto ? " " + clase : "");
  $("aviso").textContent = texto;
  clearTimeout(avisar._t);
  if (texto && clase !== "mal") avisar._t = setTimeout(() => avisar(""), 5000);
}

function pintar() {
  const casillas = [];
  for (let i = 0; i < Math.max(CASILLAS, inventario.camisetas.length); i++) {
    const c = inventario.camisetas[i];
    if (!c) {
      casillas.push('<div class="casilla vacia" aria-hidden="true"></div>');
      continue;
    }
    casillas.push(`
      <button class="casilla${inventario.puesta === c.clave ? " puesta" : ""}${elegida === c.clave ? " elegida" : ""}"
              type="button" data-clave="${esc(c.clave)}" title="${esc(c.nombre)} · vale ${monedasTexto(c.vale)} 🪙">
        <span class="casilla-camiseta" style="background:${fondoCamiseta(c)}"></span>
        <span class="casilla-nombre">${esc(c.nombre)}</span>
        <span class="casilla-accion" data-usar="${esc(c.clave)}">${inventario.puesta === c.clave ? "Sacármela" : "Usar"}</span>
      </button>`);
  }
  $("casillero").innerHTML = casillas.join("");

  const puesta = inventario.camisetas.find((c) => c.clave === inventario.puesta);
  $("casilleroPuesta").innerHTML = puesta
    ? `<button class="casilla puesta" type="button" data-clave="${esc(puesta.clave)}">
         <span class="casilla-camiseta" style="background:${fondoCamiseta(puesta)}"></span>
         <span class="casilla-nombre">${esc(puesta.nombre)}</span>
       </button>`
    : '<div class="casilla vacia"><span class="tenue" style="font-size:11px">sin camiseta</span></div>';

  pintarAnimaciones();
  pintarScores();

  if (!inventario.camisetas.length && !animaciones.animaciones.length && !scores.scores.length) {
    avisar("Todavía no tenés nada. Las camisetas y las animaciones se compran en la portada, con las monedas que ganás jugando.", "info");
  }
}

function pintarAnimaciones() {
  const casillas = [];
  for (let i = 0; i < Math.max(CASILLAS, animaciones.animaciones.length); i++) {
    const a = animaciones.animaciones[i];
    if (!a) {
      casillas.push('<div class="casilla vacia" aria-hidden="true"></div>');
      continue;
    }
    casillas.push(`
      <button class="casilla${animaciones.puesta === a.clave ? " puesta" : ""}${tipoElegido === "animacion" && elegida === a.clave ? " elegida" : ""}"
              type="button" data-animacion="${esc(a.clave)}" title="${esc(a.nombre)} · vale ${monedasTexto(a.vale)} 🪙">
        <span class="casilla-emoji">${esc(caraDe(a))}</span>
        <span class="casilla-nombre">${esc(a.nombre)}</span>
        <span class="casilla-accion" data-activar="${esc(a.clave)}">${animaciones.puesta === a.clave ? "Desactivar" : "Activar"}</span>
      </button>`);
  }
  $("casilleroAnim").innerHTML = casillas.join("");

  const puesta = animaciones.animaciones.find((a) => a.clave === animaciones.puesta);
  $("casilleroAnimPuesta").innerHTML = puesta
    ? `<button class="casilla puesta" type="button" data-animacion="${esc(puesta.clave)}">
         <span class="casilla-emoji">${esc(caraDe(puesta))}</span>
         <span class="casilla-nombre">${esc(puesta.nombre)}</span>
       </button>`
    : '<div class="casilla vacia"><span class="tenue" style="font-size:11px">sin animación</span></div>';
}

function pintarScores() {
  const casillas = [];
  for (let i = 0; i < Math.max(CASILLAS, scores.scores.length); i++) {
    const s = scores.scores[i];
    if (!s) {
      casillas.push('<div class="casilla vacia" aria-hidden="true"></div>');
      continue;
    }
    casillas.push(`
      <button class="casilla${scores.puesto === s.clave ? " puesta" : ""}${tipoElegido === "score" && elegida === s.clave ? " elegida" : ""}"
              type="button" data-score="${esc(s.clave)}" title="${esc(s.nombre)} · vale ${monedasTexto(s.vale)} 🪙">
        <span class="casilla-emoji" style="color:#${esc(s.color)};font-size:19px">🥅</span>
        <span class="casilla-nombre">${esc(s.nombre)}</span>
        <span class="casilla-accion" data-ponerscore="${esc(s.clave)}">${scores.puesto === s.clave ? "Desactivar" : "Activar"}</span>
      </button>`);
  }
  $("casilleroScores").innerHTML = casillas.join("");

  const puesto = scores.scores.find((s) => s.clave === scores.puesto);
  $("casilleroScorePuesto").innerHTML = puesto
    ? `<button class="casilla puesta" type="button" data-score="${esc(puesto.clave)}">
         <span class="casilla-emoji" style="color:#${esc(puesto.color)};font-size:19px">🥅</span>
         <span class="casilla-nombre">${esc(puesto.nombre)}</span>
       </button>`
    : '<div class="casilla vacia"><span class="tenue" style="font-size:11px">sin cartel</span></div>';
}

function abrirScore(clave) {
  const s = scores.scores.find((x) => x.clave === clave);
  if (!s) return;
  elegida = clave;
  tipoElegido = "score";
  frenarPrevia();
  $("itemCamiseta").hidden = true;
  $("itemAnimacion").hidden = true;
  $("itemScore").hidden = false;
  $("itemNombre").textContent = s.nombre;
  $("itemTexto").textContent = s.detalle || s.descripcion || "Sale cuando hacés un gol.";
  const linea = $("previaCartel");
  linea.textContent = s.ejemplo || s.plantilla;
  linea.style.color = "#" + s.color;
  linea.style.fontWeight = s.estilo === "bold" ? "700" : "400";
  $("itemPagado").textContent = monedasTexto(s.pagada) + " 🪙";
  $("itemVale").textContent = monedasTexto(s.vale) + " 🪙  (30% menos de lo que vale hoy)";
  $("itemCuando").textContent = new Date(s.comprada).toLocaleDateString("es-PY");
  $("usar").textContent = scores.puesto === clave ? "Desactivar" : "Activar";
  $("vender").textContent = "Vender por " + monedasTexto(s.vale) + " 🪙";
  $("detalle").hidden = false;
  pintar();
}

function abrirAnimacion(clave) {
  const a = animaciones.animaciones.find((x) => x.clave === clave);
  if (!a) return;
  elegida = clave;
  tipoElegido = "animacion";
  frenarPrevia();
  $("itemCamiseta").hidden = true;
  $("itemScore").hidden = true;
  $("itemAnimacion").hidden = false;
  $("itemNombre").textContent = a.nombre;
  const comoEs = a.tipo === "tamano" ? "Se hace grande y chico"
    : a.tipo === "ambas" ? "Emojis y se hace grande y chico"
    : "Le pasan emojis o letras";
  $("itemTexto").textContent = (a.detalle || a.descripcion || comoEs) + " · dura " + (a.duracionMs / 1000).toFixed(1) + " s";
  $("itemPagado").textContent = monedasTexto(a.pagada) + " 🪙";
  $("itemVale").textContent = monedasTexto(a.vale) + " 🪙  (30% menos de lo que pagaste)";
  $("itemCuando").textContent = new Date(a.comprada).toLocaleDateString("es-PY");
  $("usar").textContent = animaciones.puesta === clave ? "Desactivar" : "Activar";
  $("vender").textContent = "Vender por " + monedasTexto(a.vale) + " 🪙";
  $("detalle").hidden = false;
  pintar();
}

function abrir(clave) {
  const c = inventario.camisetas.find((x) => x.clave === clave);
  if (!c) return;
  elegida = clave;
  tipoElegido = "camiseta";
  frenarPrevia();
  $("itemCamiseta").hidden = false;
  $("itemAnimacion").hidden = true;
  $("itemScore").hidden = true;
  $("itemCamiseta").style.background = fondoCamiseta(c);
  $("itemNumero").style.color = "#" + c.colorTexto;
  $("itemNombre").textContent = c.nombre;
  $("itemTexto").textContent = c.detalle || c.descripcion || "";
  $("itemPagado").textContent = monedasTexto(c.pagada) + " 🪙";
  $("itemVale").textContent = monedasTexto(c.vale) + " 🪙  (30% menos de lo que pagaste)";
  $("itemCuando").textContent = new Date(c.comprada).toLocaleDateString("es-PY");
  $("usar").textContent = inventario.puesta === clave ? "Sacármela" : "Usar";
  $("vender").textContent = "Vender por " + monedasTexto(c.vale) + " 🪙";
  $("detalle").hidden = false;
  pintar();
}

async function cargar() {
  try {
    const [mias, misAnim, misScores, cuenta] = await Promise.all([
      Sesion.pedir("/api/tienda/mias"),
      Sesion.pedir("/api/animaciones/mias"),
      Sesion.pedir("/api/scores/mios"),
      Sesion.pedir("/api/cuenta"),
    ]);
    inventario = mias;
    animaciones = misAnim;
    scores = misScores;
    $("saldo").textContent = monedasTexto(cuenta.cuenta.monedas);
    const sigueAhi = tipoElegido === "animacion" ? animaciones.animaciones.some((a) => a.clave === elegida)
      : tipoElegido === "score" ? scores.scores.some((s) => s.clave === elegida)
      : inventario.camisetas.some((c) => c.clave === elegida);
    if (elegida && !sigueAhi) {
      elegida = null;
      $("detalle").hidden = true;
    }
    pintar();
  } catch (error) {
    if (/iniciar sesión/i.test(error.message)) return location.replace("/frm/login/?volver=" + encodeURIComponent("/frm/inventario/"));
    avisar(error.message, "mal");
  }
}

// Prende y apaga sin abrir el detalle: es lo que se hace todo el tiempo, y abrir la ficha
// para dos clicks más era una vuelta al pedo.
async function prenderApagar(tipo, clave) {
  const ruta = tipo === "animacion" ? "/api/animaciones/elegir" : tipo === "score" ? "/api/scores/elegir" : "/api/tienda/elegir";
  const puesta = tipo === "animacion" ? animaciones.puesta : tipo === "score" ? scores.puesto : inventario.puesta;
  const sacar = puesta === clave;
  try {
    await Sesion.pedir(ruta, { method: "POST", body: JSON.stringify({ clave: sacar ? null : clave }) });
    if (tipo === "animacion") {
      avisar(sacar ? "Animación desactivada: volvés al festejo de siempre." : "Animación activada: la vas a usar en tu próximo gol.", "ok");
    } else if (tipo === "score") {
      avisar(sacar ? "Cartel desactivado: vuelve el de siempre." : "Cartel activado: se va a ver en tu próximo gol.", "ok");
    } else {
      avisar(sacar ? "Te la sacaste: volvés a la camiseta del sorteo." : "Listo. Si sos capitán, tu equipo juega con esta.", "ok");
    }
    await cargar();
    // Si el detalle estaba abierto en esa misma cosa, se refresca para que el botón cambie
    if (elegida === clave && tipoElegido === tipo) {
      (tipo === "animacion" ? abrirAnimacion : tipo === "score" ? abrirScore : abrir)(clave);
    }
  } catch (error) { avisar(error.message, "mal"); }
}

document.addEventListener("click", (e) => {
  // Primero el cartelito de "Activar" / "Usar": si se tocó eso, no se abre la ficha
  const ponerScore = e.target.closest("[data-ponerscore]");
  if (ponerScore) { e.preventDefault(); e.stopPropagation(); return prenderApagar("score", ponerScore.dataset.ponerscore); }
  const activar = e.target.closest("[data-activar]");
  if (activar) { e.preventDefault(); e.stopPropagation(); return prenderApagar("animacion", activar.dataset.activar); }
  const usar = e.target.closest("[data-usar]");
  if (usar) { e.preventDefault(); e.stopPropagation(); return prenderApagar("camiseta", usar.dataset.usar); }

  const deScore = e.target.closest(".casilla[data-score]");
  if (deScore) return abrirScore(deScore.dataset.score);
  const deAnimacion = e.target.closest(".casilla[data-animacion]");
  if (deAnimacion) return abrirAnimacion(deAnimacion.dataset.animacion);
  const casilla = e.target.closest(".casilla[data-clave]");
  if (casilla) abrir(casilla.dataset.clave);
});

$("usar").onclick = async () => {
  if (!elegida) return;

  if (tipoElegido === "score") return prenderApagar("score", elegida);

  // Las animaciones se prenden y se apagan acá mismo
  if (tipoElegido === "animacion") {
    const apagar = animaciones.puesta === elegida;
    try {
      await Sesion.pedir("/api/animaciones/elegir", { method: "POST", body: JSON.stringify({ clave: apagar ? null : elegida }) });
      avisar(apagar ? "Animación desactivada: volvés al festejo de siempre." : "Animación activada: la vas a usar en tu próximo gol.", "ok");
      const cual = elegida;
      await cargar();
      if (animaciones.animaciones.some((a) => a.clave === cual)) abrirAnimacion(cual);
    } catch (error) { avisar(error.message, "mal"); }
    return;
  }

  const sacar = inventario.puesta === elegida;
  try {
    await Sesion.pedir("/api/tienda/elegir", { method: "POST", body: JSON.stringify({ clave: sacar ? null : elegida }) });
    avisar(sacar ? "Te la sacaste: volvés a la camiseta del sorteo." : "Listo. Si sos capitán, tu equipo juega con esta.", "ok");
    await cargar();
    if (elegida) abrir(elegida);
  } catch (error) { avisar(error.message, "mal"); }
};

$("vender").onclick = async () => {
  if (!elegida) return;

  if (tipoElegido === "score") {
    const s = scores.scores.find((x) => x.clave === elegida);
    if (!s || !confirm(`¿Vender el cartel ${s.nombre}? Te devuelven ${monedasTexto(s.vale)} monedas.`)) return;
    try {
      const r = await Sesion.pedir("/api/scores/vender", { method: "POST", body: JSON.stringify({ clave: elegida }) });
      elegida = null;
      $("detalle").hidden = true;
      avisar(`Vendiste ${s.nombre} por ${monedasTexto(r.devuelto)} 🪙. Te quedan ${monedasTexto(r.saldo)} monedas.`, "ok");
      cargar();
    } catch (error) { avisar(error.message, "mal"); }
    return;
  }

  if (tipoElegido === "animacion") {
    const a = animaciones.animaciones.find((x) => x.clave === elegida);
    if (!a || !confirm(`¿Vender la animación ${a.nombre}? Te devuelven ${monedasTexto(a.vale)} monedas de las ${monedasTexto(a.pagada)} que pagaste.`)) return;
    try {
      const r = await Sesion.pedir("/api/animaciones/vender", { method: "POST", body: JSON.stringify({ clave: elegida }) });
      elegida = null;
      $("detalle").hidden = true;
      avisar(`Vendiste ${a.nombre} por ${monedasTexto(r.devuelto)} 🪙. Te quedan ${monedasTexto(r.saldo)} monedas.`, "ok");
      cargar();
    } catch (error) { avisar(error.message, "mal"); }
    return;
  }

  const c = inventario.camisetas.find((x) => x.clave === elegida);
  if (!c || !confirm(`¿Vender la camiseta de ${c.nombre}? Te devuelven ${monedasTexto(c.vale)} monedas de las ${monedasTexto(c.pagada)} que pagaste.`)) return;
  try {
    const r = await Sesion.pedir("/api/tienda/vender", { method: "POST", body: JSON.stringify({ clave: elegida }) });
    elegida = null;
    $("detalle").hidden = true;
    avisar(`Vendiste la de ${r.vendida} por ${monedasTexto(r.devuelto)} 🪙. Te quedan ${monedasTexto(r.saldo)} monedas.`, "ok");
    cargar();
  } catch (error) { avisar(error.message, "mal"); }
};

// ── Probar la animación acá mismo (la misma cuenta que hace la sala) ──
let relojPrevia = null;
function frenarPrevia() {
  if (relojPrevia) clearInterval(relojPrevia);
  relojPrevia = null;
  if ($("avatarMini")) $("avatarMini").textContent = "";
  if ($("muneco")) $("muneco").style.transform = "scale(1)";
}

$("probar").onclick = () => {
  const a = animaciones.animaciones.find((x) => x.clave === elegida);
  if (!a) return;
  frenarPrevia();
  const cuadros = a.cuadros || [];
  const paso = Math.max(60, a.msPorCuadro || 200);
  const pasos = Math.ceil(Math.max(paso, a.duracionMs || 3000) / paso);
  const haceCuadros = a.tipo !== "tamano" && cuadros.length > 0;
  const haceTamano = a.tipo !== "secuencia";
  let i = 0;
  relojPrevia = setInterval(() => {
    if (haceCuadros) $("avatarMini").textContent = cuadros[i % cuadros.length];
    if (haceTamano) {
      const vaiven = (Math.sin((i / 2) * Math.PI) + 1) / 2;
      $("muneco").style.transform = "scale(" + (a.tamanoDesde + (a.tamanoHasta - a.tamanoDesde) * vaiven) + ")";
    }
    i++;
    if (i >= pasos) frenarPrevia();
  }, paso);
};

cargar();
</script>
</body>
</html>
