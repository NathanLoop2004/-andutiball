<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crear cuenta · ÑandutíBall</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/nanduti.css">
</head>
<body>

<header class="barra">
  <a class="marca" href="/"><img src="/img/logo.svg" alt=""><span>ÑandutíBall</span></a>
  <div class="derecha"><a class="boton fantasma" href="/frm/login/">Iniciar sesión</a></div>
</header>

<main class="auth">
  <form class="caja" id="formulario">
    <img class="logo-caja" src="/img/logo.svg" alt="">
    <h1>Crear cuenta</h1>
    <div class="ayuda">Guardá tu nombre para que nadie más pueda usarlo en las salas.</div>

    <div class="campo">
      <label for="nick">Nombre en HaxBall</label>
      <input type="text" id="nick" autocomplete="username" maxlength="60" required autofocus>
      <div class="nota-campo">Tal cual lo escribís al entrar a la sala.</div>
    </div>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" autocomplete="email" maxlength="200" required>
      <div class="nota-campo">Lo usamos para recuperar tu cuenta y confirmar cambios de contraseña.</div>
    </div>

    <div class="campo">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" autocomplete="new-password" minlength="4" required>
      <div class="nota-campo">Mínimo 4 caracteres.</div>
    </div>

    <div class="campo">
      <label for="clave2">Repetir contraseña</label>
      <input type="password" id="clave2" autocomplete="new-password" minlength="4" required>
    </div>

    <button class="boton principal" type="submit" id="crear">Crear cuenta</button>
    <div class="aviso" id="aviso"></div>
    <div class="pie-caja">¿Ya tenés cuenta? <a href="/frm/login/">Iniciá sesión</a></div>
  </form>
</main>

<script src="/js/sesion.js"></script>
<script>
const $ = (id) => document.getElementById(id);

$("formulario").onsubmit = async (evento) => {
  evento.preventDefault();
  if ($("clave").value !== $("clave2").value) {
    $("aviso").className = "aviso mal";
    $("aviso").textContent = "Las dos contraseñas tienen que ser iguales.";
    return;
  }
  $("crear").disabled = true;
  $("aviso").className = "aviso info";
  $("aviso").textContent = "Creando tu cuenta…";
  try {
    const { token, usuario } = await Sesion.pedir("/api/auth/registrar", {
      method: "POST",
      body: JSON.stringify({ nick: $("nick").value.trim(), email: $("email").value.trim(), clave: $("clave").value }),
    });
    Sesion.guardar(token, usuario);
    location.href = "/";
  } catch (error) {
    $("aviso").className = "aviso mal";
    $("aviso").textContent = error.message;
    $("crear").disabled = false;
  }
};

if (Sesion.usuario()) location.href = "/";
</script>
</body>
</html>
