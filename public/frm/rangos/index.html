<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rangos · ÑandutíBall</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/nanduti.css">
<script src="/js/tema.js"></script>
<script src="/js/sesion.js"></script>
</head>
<body>
<script>if (!Sesion.exigirAdmin()) { document.documentElement.innerHTML = ""; } else { Sesion.mantener(); }</script>

<header class="barra ancha">
  <a class="marca" href="/"><img src="/img/logo.svg" alt=""><span>ÑandutíBall</span></a>
  <div class="derecha" id="derecha"></div>
</header>

<main class="contenido ancho">
  <div class="cabecera">
    <div>
      <h1>Rangos</h1>
      <p>Quién tiene cada rango y cuáles dan admin. Las salas encendidas lo toman en unos segundos, sin reiniciarlas.</p>
    </div>
    <div class="acciones">
      <button class="boton" id="recargar">Descartar cambios</button>
      <button class="boton principal" id="guardar">Guardar cambios</button>
    </div>
  </div>

  <div class="aviso" id="aviso" role="status"></div>
  <div class="tarjeta" id="roles" style="margin-top:14px"><div class="tarjeta-cuerpo tenue">Cargando…</div></div>
</main>

<footer class="pie">ÑandutíBall · Panel de administración</footer>

<script>
Sesion.pintarBarra("derecha");
Sesion.pintarNavAdmin("rangos");
Sesion.refrescar().then((u) => { if (u) { Sesion.pintarBarra("derecha"); Sesion.pintarNavAdmin("rangos"); } });

let datos = { roles: [] };
let sinGuardar = false;
const esc = (t) => String(t ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

function avisar(texto, clase) {
  const aviso = document.getElementById("aviso");
  aviso.className = "aviso " + (clase || "");
  aviso.textContent = texto || "";
}

function marcarCambios() {
  sinGuardar = true;
  avisar("Tenés cambios sin guardar.", "info");
}

function pintar() {
  document.getElementById("roles").innerHTML = datos.roles
    .map((rol, i) => `
      <div class="rol">
        <div class="titulo">
          <b>${esc(rol.nombre)}</b>
          ${rol.admin ? '<span class="etiqueta admin">da admin</span>' : '<span class="etiqueta">sin admin</span>'}
          <span class="tenue" style="font-size:13px">${rol.nicks.length} ${rol.nicks.length === 1 ? "jugador" : "jugadores"}</span>
          <label style="display:flex;gap:8px;align-items:center;margin:0 0 0 auto;font-weight:500">
            Da admin <span class="interruptor"><input type="checkbox" data-admin="${i}" ${rol.admin ? "checked" : ""}><span></span></span>
          </label>
        </div>
        <div class="nicks">
          ${rol.nicks.length
            ? rol.nicks.map((n, j) => `<span class="nick">${esc(n)}<button data-quitar="${i}-${j}" title="Quitar a ${esc(n)}" aria-label="Quitar a ${esc(n)}">×</button></span>`).join("")
            : '<span class="tenue" style="font-size:13px">Nadie tiene este rango.</span>'}
        </div>
        <div class="agregar">
          <input type="text" placeholder="Nick exacto del jugador" data-input="${i}" aria-label="Agregar jugador a ${esc(rol.nombre)}">
          <button class="boton chico" data-agregar="${i}">Agregar</button>
        </div>
      </div>`)
    .join("");

  document.querySelectorAll("[data-agregar]").forEach((b) =>
    b.addEventListener("click", () => {
      const i = +b.dataset.agregar;
      const input = document.querySelector(`[data-input="${i}"]`);
      const nick = input.value.trim();
      if (!nick) return;
      if (!datos.roles[i].nicks.includes(nick)) datos.roles[i].nicks.push(nick);
      input.value = "";
      pintar();
      marcarCambios();
    })
  );
  document.querySelectorAll("[data-input]").forEach((input) =>
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.querySelector(`[data-agregar="${input.dataset.input}"]`).click();
    })
  );
  document.querySelectorAll("[data-quitar]").forEach((b) =>
    b.addEventListener("click", () => {
      const [i, j] = b.dataset.quitar.split("-").map(Number);
      datos.roles[i].nicks.splice(j, 1);
      pintar();
      marcarCambios();
    })
  );
  document.querySelectorAll("[data-admin]").forEach((c) =>
    c.addEventListener("change", () => {
      datos.roles[+c.dataset.admin].admin = c.checked;
      pintar();
      marcarCambios();
    })
  );
}

async function cargar() {
  try {
    const res = await fetch("/api/rangos", { cache: "no-store" });
    datos = await res.json();
    sinGuardar = false;
    avisar("");
    pintar();
  } catch (error) {
    avisar("No se pudieron cargar los rangos: " + error.message, "mal");
  }
}

document.getElementById("guardar").addEventListener("click", async () => {
  try {
    const res = await fetch("/api/rangos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roles: datos.roles }),
    });
    const respuesta = await res.json();
    if (!res.ok) throw new Error(respuesta.error || "error al guardar");
    datos = respuesta;
    sinGuardar = false;
    pintar();
    avisar(respuesta.aviso || "Guardado. Las salas encendidas lo toman en unos segundos.", respuesta.aviso ? "info" : "ok");
  } catch (error) {
    avisar(error.message, "mal");
  }
});

document.getElementById("recargar").addEventListener("click", cargar);
window.addEventListener("beforeunload", (e) => { if (sinGuardar) { e.preventDefault(); e.returnValue = ""; } });
cargar();
</script>
</body>
</html>
