<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rangos · ÑandutíBall</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/nanduti.css">
<script src="/js/tema.js"></script>
<script src="/js/sesion.js"></script>
<script>if (!Sesion.usuario()) location.replace("/frm/login/?volver=" + encodeURIComponent("/frm/rangos/"));</script>
<style>
  .elegir { position: relative; flex: 1; max-width: 340px; }
  .elegir input { height: 34px; }
  .opciones { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; max-height: 240px; overflow: auto; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra-menu); padding: 4px; }
  .opciones button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: var(--radio-chico); background: transparent; color: var(--texto); font: 14px var(--fuente); text-align: left; cursor: pointer; }
  .opciones button:hover, .opciones button.activa { background: var(--superficie-2); }
  .opciones button .avatar { width: 24px; height: 24px; font-size: 11px; }
  .opciones .nada { padding: 8px 10px; color: var(--tenue); font-size: 13px; }
  .nick.sin-cuenta { border-style: dashed; }
</style>
</head>
<body>

<header class="barra ancha">
  <a class="marca" href="/"><img src="/img/logo.svg" alt=""><span>ÑandutíBall</span></a>
  <div class="derecha" id="derecha"></div>
</header>

<main class="contenido ancho">
  <div class="cabecera">
    <div>
      <h1>Rangos</h1>
      <p>Quién tiene cada rango y cuáles dan admin. Solo OWNER y CO-OWNER ven esta pantalla. Las salas lo toman en unos segundos.</p>
    </div>
    <div class="acciones">
      <button class="boton" id="recargar">Descartar cambios</button>
      <button class="boton principal" id="guardar">Guardar cambios</button>
    </div>
  </div>

  <div class="aviso" id="aviso" role="status"></div>
  <div class="tarjeta" id="roles" style="margin-top:14px"><div class="tarjeta-cuerpo tenue">Cargando…</div></div>
</main>

<footer class="pie">ÑandutíBall · Panel de administración</footer>

<script>
let datos = { roles: [] };
let sinGuardar = false;
let cuentas = new Set();   // nicks (en minúscula) que tienen cuenta, para marcar los que no
const esc = (t) => String(t ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const igual = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();

function avisar(texto, clase) {
  const aviso = document.getElementById("aviso");
  aviso.className = "aviso " + (clase || "");
  aviso.textContent = texto || "";
}

function marcarCambios() {
  sinGuardar = true;
  avisar("Tenés cambios sin guardar.", "info");
}

function pintar() {
  document.getElementById("roles").innerHTML = datos.roles
    .map((rol, i) => `
      <div class="rol">
        <div class="titulo">
          <b>${esc(rol.nombre)}</b>
          ${rol.admin ? '<span class="etiqueta admin">da admin</span>' : '<span class="etiqueta">sin admin</span>'}
          <span class="tenue" style="font-size:13px">${rol.nicks.length} ${rol.nicks.length === 1 ? "jugador" : "jugadores"}</span>
          <label style="display:flex;gap:8px;align-items:center;margin:0 0 0 auto;font-weight:500">
            Da admin <span class="interruptor"><input type="checkbox" data-admin="${i}" ${rol.admin ? "checked" : ""}><span></span></span>
          </label>
        </div>
        <div class="nicks">
          ${rol.nicks.length
            ? rol.nicks.map((n, j) => {
                const sinCuenta = cuentas.size && !cuentas.has(n.toLowerCase());
                return `<span class="nick ${sinCuenta ? "sin-cuenta" : ""}" ${sinCuenta ? 'title="Este nick no tiene cuenta en la web"' : ""}>${esc(n)}<button data-quitar="${i}-${j}" title="Quitar a ${esc(n)}" aria-label="Quitar a ${esc(n)}">×</button></span>`;
              }).join("")
            : '<span class="tenue" style="font-size:13px">Nadie tiene este rango.</span>'}
        </div>
        <div class="agregar">
          <div class="elegir">
            <input type="search" placeholder="Buscar una cuenta…" data-buscar="${i}" autocomplete="off" aria-label="Buscar una cuenta para ${esc(rol.nombre)}" aria-autocomplete="list">
            <div class="opciones" data-opciones="${i}" role="listbox" hidden></div>
          </div>
          <button class="boton chico" data-agregar="${i}" disabled>Agregar</button>
        </div>
      </div>`)
    .join("");
}

// ── Buscador de cuentas ──
let esperaBusqueda = null;
const elegidas = {};   // índice del rol → nick elegido de la lista

async function buscar(i, texto) {
  const caja = document.querySelector(`[data-opciones="${i}"]`);
  try {
    const { usuarios } = await Sesion.pedir("/api/rangos/usuarios?q=" + encodeURIComponent(texto));
    const yaTienen = datos.roles[i].nicks;
    const lista = usuarios.filter((n) => !yaTienen.some((y) => igual(y, n)));
    usuarios.forEach((n) => cuentas.add(n.toLowerCase()));
    caja.innerHTML = lista.length
      ? lista.map((n) => `<button type="button" role="option" data-elegir="${i}" data-nick="${esc(n)}"><span class="avatar">${esc(Sesion.inicial(n))}</span>${esc(n)}</button>`).join("")
      : `<div class="nada">${usuarios.length ? "Todas las cuentas que coinciden ya tienen este rango." : "No hay ninguna cuenta con ese nombre."}</div>`;
    caja.hidden = false;
  } catch (error) {
    caja.innerHTML = `<div class="nada">${esc(error.message)}</div>`;
    caja.hidden = false;
  }
}

function cerrarOpciones() {
  document.querySelectorAll("[data-opciones]").forEach((c) => (c.hidden = true));
}

function agregar(i) {
  const nick = elegidas[i];
  if (!nick) return;
  if (!datos.roles[i].nicks.some((n) => igual(n, nick))) datos.roles[i].nicks.push(nick);
  delete elegidas[i];
  pintar();
  marcarCambios();
}

const roles = document.getElementById("roles");

roles.addEventListener("input", (e) => {
  const i = e.target.dataset.buscar;
  if (i === undefined) return;
  delete elegidas[i];
  document.querySelector(`[data-agregar="${i}"]`).disabled = true;
  clearTimeout(esperaBusqueda);
  esperaBusqueda = setTimeout(() => buscar(i, e.target.value.trim()), 200);
});

roles.addEventListener("focusin", (e) => {
  const i = e.target.dataset.buscar;
  if (i !== undefined) buscar(i, e.target.value.trim());
});

roles.addEventListener("keydown", (e) => {
  const i = e.target.dataset.buscar;
  if (i === undefined) return;
  const caja = document.querySelector(`[data-opciones="${i}"]`);
  const botones = [...caja.querySelectorAll("button")];
  const activa = botones.findIndex((b) => b.classList.contains("activa"));
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!botones.length) return;
    const nueva = e.key === "ArrowDown" ? (activa + 1) % botones.length : (activa - 1 + botones.length) % botones.length;
    botones.forEach((b, j) => b.classList.toggle("activa", j === nueva));
    botones[nueva].scrollIntoView({ block: "nearest" });
  }
  if (e.key === "Enter") {
    e.preventDefault();
    if (activa >= 0) botones[activa].click();
    else if (elegidas[i]) agregar(i);
  }
  if (e.key === "Escape") cerrarOpciones();
});

roles.addEventListener("click", (e) => {
  const opcion = e.target.closest("[data-elegir]");
  if (opcion) {
    const i = opcion.dataset.elegir;
    elegidas[i] = opcion.dataset.nick;
    document.querySelector(`[data-buscar="${i}"]`).value = opcion.dataset.nick;
    document.querySelector(`[data-agregar="${i}"]`).disabled = false;
    cerrarOpciones();
    return;
  }
  const botonAgregar = e.target.closest("[data-agregar]");
  if (botonAgregar) return agregar(botonAgregar.dataset.agregar);

  const quitar = e.target.closest("[data-quitar]");
  if (quitar) {
    const [i, j] = quitar.dataset.quitar.split("-").map(Number);
    datos.roles[i].nicks.splice(j, 1);
    pintar();
    marcarCambios();
  }
});

roles.addEventListener("change", (e) => {
  if (e.target.dataset.admin === undefined) return;
  datos.roles[+e.target.dataset.admin].admin = e.target.checked;
  pintar();
  marcarCambios();
});

document.addEventListener("click", (e) => { if (!e.target.closest(".elegir")) cerrarOpciones(); });

// ── Cargar y guardar ──
function manejarError(error) {
  if (/iniciar sesión/i.test(error.message)) location.replace("/frm/login/?volver=" + encodeURIComponent("/frm/rangos/"));
  if (/solo para OWNER y CO-OWNER/i.test(error.message)) location.replace("/?sinpermiso=1");
}

async function cargar() {
  try {
    datos = await Sesion.pedir("/api/rangos");
    sinGuardar = false;
    avisar("");
    pintar();
    // Para marcar los nicks viejos que no tienen cuenta
    Sesion.pedir("/api/rangos/usuarios?q=").then((r) => { r.usuarios.forEach((n) => cuentas.add(n.toLowerCase())); }).catch(() => {});
  } catch (error) {
    manejarError(error);
    avisar("No se pudieron cargar los rangos: " + error.message, "mal");
  }
}

document.getElementById("guardar").addEventListener("click", async () => {
  try {
    const respuesta = await Sesion.pedir("/api/rangos", { method: "POST", body: JSON.stringify({ roles: datos.roles }) });
    datos = respuesta;
    sinGuardar = false;
    pintar();
    avisar(respuesta.aviso || "Guardado. Las salas encendidas lo toman en unos segundos.", respuesta.aviso ? "info" : "ok");
  } catch (error) {
    manejarError(error);
    avisar(error.message, "mal");
  }
});

document.getElementById("recargar").addEventListener("click", cargar);
window.addEventListener("beforeunload", (e) => { if (sinGuardar) { e.preventDefault(); e.returnValue = ""; } });

async function iniciar() {
  const u = await Sesion.refrescar();
  if (!u) return location.replace("/frm/login/?volver=" + encodeURIComponent("/frm/rangos/"));
  if (!Sesion.exigirRangos()) return;
  Sesion.pintarBarra("derecha");
  Sesion.pintarNavAdmin("rangos");
  Sesion.mantener();
  cargar();
}

if (Sesion.usuario()) {
  Sesion.pintarBarra("derecha");
  Sesion.pintarNavAdmin("rangos");
  iniciar();
}
</script>
</body>
</html>
