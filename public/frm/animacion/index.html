<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animación de gol · ÑandutíHax</title>
<meta name="description" content="Las animaciones de gol de ÑandutíHax se compran con las monedas que ganás jugando.">
<link rel="icon" href="/img/logo-chico.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/nanduti.css">
<script src="/js/tema.js"></script>
</head>
<body>

<header class="barra">
  <a class="marca" href="/"><img src="/img/logo-chico.png" alt=""><span>ÑandutíHax</span></a>
  <div class="derecha" id="derecha"></div>
</header>

<main class="contenido">
  <p class="tenue"><a href="/">← Volver a la portada</a></p>

  <div class="tarjeta" id="ficha" hidden>
    <div class="tarjeta-cuerpo ficha-animacion">
      <div class="cancha-previa" id="cancha">
        <canvas id="lienzo" width="1240" height="600"></canvas>
        <div class="cancha-botones">
          <button class="boton chico" type="button" id="probar">Verla de nuevo</button>
          <button class="boton chico" type="button" id="agrandar">Agrandar</button>
        </div>
      </div>
      <div class="detalle-datos">
        <h1 id="nombre">—</h1>
        <p class="tenue" id="detalle"></p>
        <dl class="lista-datos">
          <dt>Qué hace</dt><dd id="queHace">—</dd>
        </dl>
        <div class="precio" id="precio"></div>
        <div class="aviso" id="aviso"></div>
        <div class="acciones">
          <button class="boton principal" type="button" id="comprar" hidden>Comprar</button>
          <a class="boton" id="entrar" href="/frm/login/" hidden>Iniciá sesión para comprarla</a>
          <a class="boton" href="/frm/inventario/" id="verInventario" hidden>Ver mi inventario</a>
        </div>
        <p class="tenue" id="saldo"></p>
      </div>
    </div>
  </div>

  <div class="tarjeta" id="noEsta" hidden>
    <div class="tarjeta-cuerpo">
      <h1>No encontramos esa animación</h1>
      <p class="tenue">Puede que ya no esté a la venta. Mirá las que hay en la portada.</p>
      <p><a class="boton principal" href="/">Ir a la portada</a></p>
    </div>
  </div>

  <p class="tenue" id="cargando">Cargando…</p>
</main>

<script src="/js/sesion.js"></script>
<script src="/js/cancha-animacion.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = Sesion.escapar;
const monedasTexto = (n) => Number(n || 0).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1").replace(".", ",");
const unDecimal = (n) => Number(n).toFixed(1).replace(".", ",");

Sesion.pintarBarra("derecha");

const clave = new URLSearchParams(location.search).get("c");
let animacion = null;

function avisar(texto, clase) {
  $("aviso").className = "aviso" + (texto ? " " + clase : "");
  $("aviso").textContent = texto;
}

// La MISMA cancha que usa el editor del panel (js/cancha-animacion.js): la jugada entera con
// el festejo adentro, así se ve tal cual va a salir en la sala. Sin los segundos: al que la
// compra no le interesa el detalle del tiempo, le interesa cómo queda.
const cancha = CanchaAnimacion.crear($("lienzo"), {
  puntos: () => (animacion ? (animacion.cuadros || []).map((c, i) => ({ emoji: c, tamano: (animacion.tamanos || [])[i] || 1 })) : []),
  msPorCuadro: () => (animacion ? animacion.msPorCuadro : 200),
  conSegundos: false,
});
function reproducir() { if (animacion) cancha.arrancar(); }

async function cargar() {
  let animaciones = [];
  try {
    const r = await fetch("/api/animaciones", { cache: "no-store" });
    animaciones = (await r.json()).animaciones || [];
  } catch (e) { /* sin conexión: se muestra el cartel de no encontrada */ }

  animacion = animaciones.find((a) => a.clave === clave) || null;
  $("cargando").hidden = true;
  if (!animacion) { $("noEsta").hidden = false; return; }

  document.title = animacion.nombre + " · ÑandutíHax";
  $("nombre").textContent = animacion.nombre;
  $("detalle").textContent = animacion.detalle || animacion.descripcion || "Animación de gol.";
  $("queHace").textContent = animacion.tipo === "tamano" ? "Se hace grande y chico"
    : animacion.tipo === "ambas" ? "Le pasan emojis y se hace grande y chico"
    : "Le pasan emojis o letras";
  $("precio").textContent = "🪙 " + monedasTexto(animacion.precio) + " monedas";

  $("ficha").hidden = false;
  reproducir();

  const u = Sesion.usuario();
  $("comprar").hidden = !u;
  $("entrar").hidden = Boolean(u);
  if (!u) return;

  $("entrar").href = "/frm/login/?volver=" + encodeURIComponent(location.pathname + location.search);
  try {
    const { cuenta } = await Sesion.pedir("/api/cuenta");
    $("saldo").textContent = "Tenés " + monedasTexto(cuenta.monedas) + " monedas";
  } catch (e) { /* si no se puede leer el saldo, igual se puede intentar comprar */ }

  try {
    const mias = await Sesion.pedir("/api/animaciones/mias");
    if ((mias.animaciones || []).some((a) => a.clave === clave)) {
      $("comprar").hidden = true;
      $("verInventario").hidden = false;
      avisar("Esta animación ya es tuya. La prendés desde tu inventario.", "info");
    }
  } catch (e) { /* sin inventario, se deja el botón de comprar */ }
}

$("probar").onclick = reproducir;
$("agrandar").onclick = () => {
  const grande = $("cancha").classList.toggle("grande");
  $("agrandar").textContent = grande ? "Achicar" : "Agrandar";
};

$("comprar").onclick = async () => {
  $("comprar").disabled = true;
  try {
    const r = await Sesion.pedir("/api/animaciones/comprar", { method: "POST", body: JSON.stringify({ clave }) });
    avisar("¡Listo! Es tuya. Prendela desde tu inventario. Te quedan " + monedasTexto(r.saldo) + " monedas.", "ok");
    $("comprar").hidden = true;
    $("verInventario").hidden = false;
    $("saldo").textContent = "Tenés " + monedasTexto(r.saldo) + " monedas";
  } catch (error) {
    avisar(error.message, "mal");
    $("comprar").disabled = false;
  }
};

cargar();
</script>
</body>
</html>
