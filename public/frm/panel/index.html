<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salas · ÑandutíBall</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/nanduti.css">
<script src="/js/tema.js"></script>
<script src="/js/sesion.js"></script>
</head>
<body>
<script>if (!Sesion.exigirAdmin()) { document.documentElement.innerHTML = ""; } else { Sesion.mantener(); }</script>

<header class="barra ancha">
  <a class="marca" href="/"><img src="/img/logo.svg" alt=""><span>ÑandutíBall</span></a>
  <div class="derecha" id="derecha"></div>
</header>

<main class="contenido ancho">
  <div class="cabecera">
    <div>
      <h1>Salas</h1>
      <p id="resumen">Cargando…</p>
    </div>
    <span class="tenue" style="font-size:13px">Se actualiza cada 2 segundos</span>
  </div>

  <div class="pestanas" id="salasTabs" role="tablist" aria-label="Salas"></div>
  <div class="tarjeta" id="sala"></div>
</main>

<footer class="pie">ÑandutíBall · Panel de administración</footer>

<script>
Sesion.pintarBarra("derecha");
Sesion.pintarNavAdmin("salas");
Sesion.refrescar().then((u) => { if (u) { Sesion.pintarBarra("derecha"); Sesion.pintarNavAdmin("salas"); } });

const VISTAS = [
  { id: "cancha", nombre: "Cancha" },
  { id: "mensajes", nombre: "Mensajes" },
  { id: "jugadores", nombre: "Jugadores" },
  { id: "elo", nombre: "ELO" },
  { id: "bans", nombre: "Bans" },
  { id: "roles", nombre: "Rangos" },
];

let salas = [];
let salaAbierta = null;          // clave de la sala elegida
let vistaAbierta = "cancha";     // pestaña de adentro
let ultimaFirma = "";            // para no redibujar si nada cambió
let cambioDeVista = false;       // true cuando el usuario cambia de pestaña o de sala

const esc = (t) => String(t ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
const hora = (iso) => (iso ? new Date(iso).toLocaleTimeString("es-PY", { hour12: false }) : "");
const viva = (s) => s.ok && s.estado.encendida;
const nombreCorto = (n) => String(n || "").replace(/^.*\|\s*/, "").replace(/\s*🇵🇾\s*$/, "") || n;
// Nombre pintado con el color de su división de ELO
const nombreConElo = (j) =>
  typeof j.color === "number"
    ? `<span style="color:#${j.color.toString(16).padStart(6, "0")}" title="${esc(j.division)} · ${j.elo} pts">${esc(j.nombre)}</span>`
    : esc(j.nombre);

function pintarTabs() {
  document.getElementById("salasTabs").innerHTML = salas
    .map((s) => `<button role="tab" data-sala="${esc(s.clave)}" aria-selected="${s.clave === salaAbierta}">
        <span class="luz ${viva(s) ? "on" : ""}"></span>${esc(nombreCorto(s.nombre))}
      </button>`)
    .join("");

  document.querySelectorAll("[data-sala]").forEach((b) =>
    b.addEventListener("click", () => {
      salaAbierta = b.dataset.sala;
      cambioDeVista = true;
      pintarTabs();
      pintarSala();
    })
  );

  const encendidas = salas.filter(viva).length;
  document.getElementById("resumen").textContent = `${encendidas} de ${salas.length} salas encendidas`;
}

function pintarSala() {
  const sala = salas.find((s) => s.clave === salaAbierta);
  const caja = document.getElementById("sala");
  if (!sala) return (caja.innerHTML = `<div class="tarjeta-cuerpo vacio">Elegí una sala.</div>`);

  const e = sala.estado;
  const chips = !sala.ok
    ? `<span class="chip alerta">No responde: ${esc(sala.error)}</span>`
    : viva(sala)
    ? [
        `<span class="chip exito">Encendida</span>`,
        `<span class="chip">Jugadores <b>${e.jugadores.length}</b>/${e.config.CantidadDeJugadores ?? "?"}</span>`,
        `<span class="chip">Mapa <b>${esc(e.config.MapaPorDefecto ?? "—")}</b></span>`,
        `<span class="chip">Marcador <b>${e.partido.red}</b> – <b>${e.partido.blue}</b></span>`,
        `<span class="chip">${e.partido.enJuego ? "En juego" : "Sin partido"}</span>`,
        e.link ? `<a class="boton chico" href="${esc(e.link)}" target="_blank" rel="noopener">Abrir sala ↗</a>` : "",
        Sesion.usuario() && Sesion.usuario().configura ? `<a class="boton chico" href="/frm/config/">Configurar</a>` : "",
      ].join("")
    : `<span class="chip alerta">${esc(e.problema || "Esperando el link de la sala…")}</span>`;

  const html = `
    <div class="chips">${chips}</div>
    <div class="subpestanas" role="tablist">
      ${VISTAS.map((v) => `<button role="tab" data-vista="${v.id}" aria-selected="${v.id === vistaAbierta}">${v.nombre}</button>`).join("")}
    </div>
    <div class="vista" id="vista">${sala.ok ? contenido(vistaAbierta, e) : `<div class="vacio">No se pudo conectar con esta sala.</div>`}</div>
  `;

  // Si no cambió nada, no tocamos el DOM: así no parpadea ni se cierra el menú de kick/ban
  const firma = salaAbierta + "|" + vistaAbierta + "|" + html;
  if (firma === ultimaFirma) return;
  ultimaFirma = firma;

  // Guardamos dónde estaba mirando el usuario antes de redibujar
  const vistaVieja = document.getElementById("vista");
  const scrollPrevio = vistaVieja ? vistaVieja.scrollTop : 0;
  const estabaAbajo = vistaVieja ? vistaVieja.scrollTop + vistaVieja.clientHeight >= vistaVieja.scrollHeight - 30 : true;

  caja.innerHTML = html;

  caja.querySelectorAll("[data-vista]").forEach((b) =>
    b.addEventListener("click", () => {
      vistaAbierta = b.dataset.vista;
      cambioDeVista = true;
      pintarSala();
    })
  );
  caja.querySelectorAll("[data-accion]").forEach((b) =>
    b.addEventListener("click", () => ejecutarAccion(b.dataset.accion, Number(b.dataset.jugador), b.dataset.nombre))
  );
  caja.querySelectorAll(".bolita[data-jugador]").forEach((b) =>
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      abrirMenuBolita(b, Number(b.dataset.jugador), b.dataset.nombre);
    })
  );

  const vista = document.getElementById("vista");
  if (cambioDeVista) {
    vista.scrollTop = vistaAbierta === "mensajes" ? vista.scrollHeight : 0;
    cambioDeVista = false;
  } else if (estabaAbajo && vistaAbierta === "mensajes") {
    vista.scrollTop = vista.scrollHeight;
  } else {
    vista.scrollTop = scrollPrevio;
  }
}

function abrirMenuBolita(elemento, idJugador, nombre) {
  document.querySelectorAll(".menu-bolita").forEach((m) => m.remove());
  const rect = elemento.getBoundingClientRect();
  const menu = document.createElement("div");
  menu.className = "menu-bolita";
  menu.innerHTML = `<button class="boton chico">Expulsar</button><button class="boton chico peligro">Banear</button>`;
  menu.style.left = Math.min(rect.left, window.innerWidth - 200) + "px";
  menu.style.top = rect.bottom + 6 + "px";
  document.body.appendChild(menu);
  const [btnKick, btnBan] = menu.querySelectorAll("button");
  btnKick.addEventListener("click", () => { menu.remove(); ejecutarAccion("kick", idJugador, nombre); });
  btnBan.addEventListener("click", () => { menu.remove(); ejecutarAccion("ban", idJugador, nombre); });
  setTimeout(() => document.addEventListener("click", () => menu.remove(), { once: true }), 0);
}

async function ejecutarAccion(accion, idJugador, nombre) {
  const etiqueta = accion === "ban" ? "banear" : "expulsar";
  if (!confirm(`¿Seguro que querés ${etiqueta} a ${nombre}?`)) return;
  const motivo = prompt("Motivo (opcional):", "") || "";
  try {
    const datos = await Sesion.pedir(`/api/${accion}/${salaAbierta}`, { method: "POST", body: JSON.stringify({ id: idJugador, motivo }) });
    if (datos.ok === false) alert("Falló: " + (datos.error || "sin detalle"));
  } catch (error) {
    alert("No se pudo: " + error.message);
  }
}

function contenido(vista, e) {
  if (vista === "cancha") {
    const red = e.jugadores.filter((j) => j.equipo === 1);
    const blue = e.jugadores.filter((j) => j.equipo === 2);
    const spect = e.jugadores.filter((j) => j.equipo === 0);
    if (!e.jugadores.length) return `<div class="vacio">Todavía no hay nadie en la sala.</div>`;
    const pintar = (j, clase) => {
      const inicial = esc(Sesion.inicial(j.nombre).toUpperCase());
      return `<div class="bolita" data-jugador="${j.id}" data-nombre="${esc(j.nombre)}" title="Clic para expulsar o banear a ${esc(j.nombre)}">
        <div class="circulo ${clase}">${inicial}${j.admin ? '<span class="corona" title="Admin">★</span>' : ""}</div>
        <div class="nombre">${nombreConElo(j)}</div>
      </div>`;
    };
    const lado = (titulo, color, jugadores, clase, extra) =>
      `<div class="lado ${extra || ""}">
        <h3><i style="background:${color}"></i>${titulo} · ${jugadores.length}</h3>
        <div class="bolitas">${jugadores.length ? jugadores.map((j) => pintar(j, clase)).join("") : `<div class="vacio" style="padding:4px 0">Sin jugadores</div>`}</div>
      </div>`;
    return `<div class="cancha">
      ${lado("Red", "#dc2626", red, "red")}
      ${lado("Blue", "#2563eb", blue, "blue")}
      ${lado("Espectadores", "#64748b", spect, "spect", "cancha-full")}
    </div>`;
  }

  if (vista === "mensajes") {
    if (!e.mensajes.length) return `<div class="vacio">Todavía no hay mensajes.</div>`;
    return e.mensajes
      .map((m) => `<div class="linea tipo-${esc(m.tipo)}">
          <span class="hora">${hora(m.hora)}</span>
          <span>${m.tipo === "chat" ? `<span class="quien">${esc(m.jugador)}</span> ` : ""}<span class="txt">${esc(m.texto)}</span></span>
        </div>`)
      .join("");
  }

  if (vista === "jugadores") {
    if (!e.jugadores.length) return `<div class="vacio">No hay nadie en la sala.</div>`;
    return `<table class="tabla tabla-panel"><thead><tr><th>ID</th><th>Nombre</th><th>Equipo</th><th>Admin</th><th class="der">Acciones</th></tr></thead><tbody>
      ${e.jugadores.map((j) => `<tr><td class="tenue">${j.id}</td><td class="jugador">${nombreConElo(j)}</td>
          <td>${j.equipo === 1 ? '<span class="etiqueta ban">Red</span>' : j.equipo === 2 ? '<span class="etiqueta acento">Blue</span>' : '<span class="etiqueta">Espectador</span>'}</td>
          <td>${j.admin ? '<span class="etiqueta pendiente">admin</span>' : ""}</td>
          <td class="der"><div class="acciones" style="justify-content:flex-end">
            <button class="boton chico" data-accion="kick" data-jugador="${j.id}" data-nombre="${esc(j.nombre)}">Expulsar</button>
            <button class="boton chico peligro" data-accion="ban" data-jugador="${j.id}" data-nombre="${esc(j.nombre)}">Banear</button>
          </div></td></tr>`).join("")}</tbody></table>`;
  }

  if (vista === "elo") {
    const ranking = e.elo || [];
    const divisiones = e.divisiones || [];
    const escala = divisiones.length
      ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">${divisiones
          .map((d) => `<span class="division"><i style="background:#${d.color}"></i>${esc(d.nombre)} · ${d.desde}+</span>`)
          .join("")}</div>`
      : "";
    if (!ranking.length) return escala + `<div class="vacio">Todavía no hay partidos jugados. El puntaje arranca en 1000.</div>`;
    const tope = Math.max(...ranking.map((f) => f.elo), 1);
    return escala + `<table class="tabla tabla-panel"><thead><tr><th class="puesto">#</th><th>Jugador</th><th>División</th><th class="der">ELO</th><th class="der">PJ</th><th class="der">G-E-P</th><th style="width:22%"></th></tr></thead><tbody>
      ${ranking.map((f, i) => `<tr>
          <td class="puesto">${i + 1}</td>
          <td class="jugador">${esc(f.nombre)}</td>
          <td><span class="division"><i style="background:#${f.division.color}"></i>${esc(f.division.nombre)}</span></td>
          <td class="der num"><b>${f.elo}</b></td>
          <td class="der num">${f.partidos}</td>
          <td class="der num">${f.ganados}-${f.empatados}-${f.perdidos}</td>
          <td><span class="barra-elo" style="width:${Math.round((f.elo / tope) * 100)}%;background:#${f.division.color}"></span></td>
        </tr>`).join("")}</tbody></table>`;
  }

  if (vista === "bans") {
    if (!e.bans.length) return `<div class="vacio">No hay baneados en esta sesión.</div>`;
    return `<table class="tabla tabla-panel"><thead><tr><th>Hora</th><th>Jugador</th><th>Motivo</th><th>Por</th></tr></thead><tbody>
      ${e.bans.map((b) => `<tr><td class="tenue">${hora(b.hora)}</td><td class="jugador">${esc(b.jugador)}</td><td>${esc(b.motivo || "—")}</td><td>${esc(b.por)}</td></tr>`).join("")}</tbody></table>`;
  }

  // Rangos
  const rangos = e.rangos && e.rangos.roles ? e.rangos.roles.filter((x) => x.nicks.length) : [];
  if (!rangos.length) return `<div class="vacio">No hay rangos cargados. Se editan en <a href="/frm/rangos/">Rangos</a>.</div>`;
  return `<table class="tabla tabla-panel"><thead><tr><th>Rango</th><th>Jugadores</th><th>Da admin</th></tr></thead><tbody>
    ${rangos.map((x) => `<tr><td class="jugador">${esc(x.nombre)}</td><td style="white-space:normal">${esc(x.nicks.join(", "))}</td><td>${x.admin ? '<span class="etiqueta admin">sí</span>' : ""}</td></tr>`).join("")}</tbody></table>`;
}

async function actualizar() {
  try {
    const res = await fetch("/api/salas", { cache: "no-store" });
    salas = (await res.json()).salas;
    if (!salaAbierta || !salas.some((s) => s.clave === salaAbierta)) salaAbierta = salas[0] && salas[0].clave;
    pintarTabs();
    pintarSala();
  } catch {
    document.getElementById("resumen").textContent = "No se pudo hablar con el panel.";
  }
}

actualizar();
setInterval(actualizar, 2000);
</script>
</body>
</html>
