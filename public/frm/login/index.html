<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión · ÑandutíBall</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/nanduti.css">
</head>
<body>

<header class="barra">
  <a class="marca" href="/"><img src="/img/logo.svg" alt=""><span>ÑandutíBall</span></a>
  <div class="derecha"><a class="boton fantasma" href="/frm/registro/">Crear cuenta</a></div>
</header>

<main class="auth">
  <form class="caja" id="formulario">
    <img class="logo-caja" src="/img/logo.svg" alt="">
    <h1>Iniciar sesión</h1>
    <div class="ayuda">Usá el mismo nombre y contraseña que en las salas.</div>

    <div class="campo">
      <label for="nick">Nombre en HaxBall</label>
      <input type="text" id="nick" autocomplete="username" maxlength="60" required autofocus>
    </div>

    <div class="campo">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" autocomplete="current-password" required>
      <div class="nota-campo"><a href="/frm/recuperar/">¿Olvidaste tu contraseña?</a></div>
    </div>

    <button class="boton principal" type="submit" id="entrar">Entrar</button>
    <div class="aviso" id="aviso"></div>
    <div class="pie-caja">¿No tenés cuenta? <a href="/frm/registro/">Creala acá</a></div>
  </form>
</main>

<script src="/js/sesion.js"></script>
<script>
const $ = (id) => document.getElementById(id);
// Solo se vuelve a páginas de este mismo sitio (nada de ?volver=https://otro-lado)
const pedido = new URLSearchParams(location.search).get("volver");
const volverA = pedido && pedido.startsWith("/") && !pedido.startsWith("//") ? pedido : null;

$("formulario").onsubmit = async (evento) => {
  evento.preventDefault();
  $("entrar").disabled = true;
  $("aviso").className = "aviso info";
  $("aviso").textContent = "Entrando…";
  try {
    const { token, usuario } = await Sesion.pedir("/api/auth/entrar", {
      method: "POST",
      body: JSON.stringify({ nick: $("nick").value.trim(), clave: $("clave").value }),
    });
    Sesion.guardar(token, usuario);
    location.href = volverA || (usuario.admin ? "/frm/panel/" : "/");
  } catch (error) {
    $("aviso").className = "aviso mal";
    $("aviso").textContent = error.message;
    $("entrar").disabled = false;
  }
};

if (Sesion.usuario()) location.href = volverA || "/";
</script>
</body>
</html>
