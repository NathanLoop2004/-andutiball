# Tres salas con la misma imagen y el mismo script.js; cada una con su configuración (hosts/*.json)
# y su propio token (cada sala necesita un token distinto, ver .env).
# El panel (http://localhost:8080) muestra el estado de las tres.

x-haxball: &haxball
  build: .
  image: nandutiball-host
  init: true
  # Chrome necesita más memoria compartida que los 64 MB por defecto
  shm_size: 1gb
  # El token vence en minutos: reintentar infinito con un token vencido no sirve de nada
  restart: on-failure:3
  volumes:
    # Editar script.js o hosts/*.json sin reconstruir la imagen (basta con: docker compose restart)
    - ./script.js:/home/pptruser/app/script.js:ro
    - ./hosts:/home/pptruser/app/hosts:ro
    # Los rangos y su clave: las salas los vigilan y los recargan sin reiniciarse
    - ./roles.json:/home/pptruser/app/roles.json:ro
    # Las pantallas, para poder retocarlas sin reconstruir la imagen
    - ./public:/home/pptruser/app/public:ro

services:
  host-3v3:
    <<: *haxball
    container_name: nandutiball-3v3
    environment:
      HOST_CONFIG: hosts/3v3.json
      ROOM_NAME: 3v3
      HAXBALL_TOKEN: ${TOKEN_3V3:?Falta TOKEN_3V3 en .env}

  host-4v4:
    <<: *haxball
    container_name: nandutiball-4v4
    environment:
      HOST_CONFIG: hosts/4v4.json
      ROOM_NAME: 4v4
      HAXBALL_TOKEN: ${TOKEN_4V4:?Falta TOKEN_4V4 en .env}

  host-todos:
    <<: *haxball
    container_name: nandutiball-todos
    environment:
      HOST_CONFIG: hosts/todos.json
      ROOM_NAME: Futsal automático
      HAXBALL_TOKEN: ${TOKEN_TODOS:?Falta TOKEN_TODOS en .env}

  host-rs:
    <<: *haxball
    container_name: nandutiball-realsoccer
    environment:
      HOST_CONFIG: hosts/realsoccer.json
      ROOM_NAME: Real Soccer
      HAXBALL_TOKEN: ${TOKEN_REALSOCCER:?Falta TOKEN_REALSOCCER en .env}

  panel:
    # Misma imagen que las salas: así tiene express y la capa MVC (app.js, routes…)
    build: .
    image: nandutiball-host
    container_name: nandutiball-panel
    working_dir: /home/pptruser/app
    command: node panel/server.js
    ports:
      - "8080:8080"
    environment:
      PANEL_PORT: 8080
      SALAS: "3v3|Futsal 3v3|http://host-3v3:3000,4v4|Futsal 4v4|http://host-4v4:3000,todos|Futsal automático|http://host-todos:3000,rs|Real Soccer|http://host-rs:3000"
    volumes:
      - ./public:/home/pptruser/app/public:ro
      # Se escribe desde la pantalla de rangos, así que va sin :ro
      - ./roles.json:/home/pptruser/app/roles.json
    restart: unless-stopped
    depends_on: [host-3v3, host-4v4, host-todos, host-rs]
